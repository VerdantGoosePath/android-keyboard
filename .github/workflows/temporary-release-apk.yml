name: Temporary signed release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.0.0-temp-${{ github.run_number }}
      BRANCH_NAME: master

    steps:
      - name: Checkout with required submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Android SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$sdkmanager_path" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build dependencies
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Generate a throwaway signing certificate
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/temp-release.jks" \
            -storepass "$password" -keypass "$password" \
            -alias temp-release -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=Temporary CI Build, O=Local Build, C=GB"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=temp-release\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/temp-release.jks" "$password" "$password" > keystore.properties

      - name: Build stable release APK
        run: ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-stable-release-temp-signed
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 14
