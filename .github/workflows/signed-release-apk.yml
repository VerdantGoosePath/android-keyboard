name: Signed stable release APK

on:
  push:
    branches: [master, 'feature/smart-formatting']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-stable-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.0.0-ci-${{ github.run_number }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout with required submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true
          persist-credentials: false

      # actions/checkout's lfs option does not reliably hydrate nested submodule LFS files.
      - name: Download swipe model data from Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git -C java/assets/futo-swipe lfs install --local
          git -C java/assets/futo-swipe lfs pull --include='honorable_sturgeon/model_fp32.pte,magic_macaw/model_fp32.pte,chosen_planarian/context_lm.pte'

      - name: Validate swipe assets and release gate tests
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 tools/verify_swipe_models.py --directory java/assets/futo-swipe

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Android SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$sdkmanager_path" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compile stable release Kotlin before signing
        # Keeps build verification independent of whether Actions secrets are configured.
        run: ./gradlew compileStableReleaseKotlin --no-daemon --stacktrace

      - name: Restore permanent signing key from GitHub secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/android-keyboard-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties

      - name: Build stable release APK
        run: ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Check packaged swipe models and signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$(find build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          python3 tools/verify_swipe_models.py --apk "$apk"
          signer_info="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_info"
          expected_sha="$(keytool -exportcert -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/android-keyboard-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | sha256sum | awk '{print $1}')"
          actual_sha="$(printf '%s\n' "$signer_info" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_sha" || "$expected_sha" != "$actual_sha" ]]; then
            echo "::error::APK signer does not match the configured permanent release keystore"
            exit 1
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-keyboard-stable-release-signed
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/android-keyboard-release.jks"
